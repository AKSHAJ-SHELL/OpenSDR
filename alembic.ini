# Alembic configuration for Craftsman.
#
# The database URL is intentionally NOT set here — env.py reads it from the app's
# Settings (craftsman/core/config.py) so there is one source of truth. Run migrations
# with `alembic upgrade head`; the API also applies them automatically on startup.

[alembic]
# Where the migration scripts live (inside the package so they ship in the Docker image).
# %(here)s is the directory holding this file, so this resolves the same regardless of
# the current working directory (the API applies migrations on startup from anywhere).
script_location = %(here)s/craftsman/migrations

# Filename format for new revisions: a zero-padded counter + a slug, e.g. 0001_baseline.py
file_template = %%(rev)s_%%(slug)s

# Keep timezone-naive timestamps out of filenames; the counter + slug is enough.
prepend_sys_path = .
# Use the OS path separator when splitting the path list above.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
