services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: craftsman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-craftsman}
      POSTGRES_DB: craftsman
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftsman"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # web UI + HTTP API
      - "127.0.0.1:1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build: .
    command: uvicorn craftsman.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://craftsman:${POSTGRES_PASSWORD:-craftsman}@postgres:5432/craftsman
      REDIS_URL: redis://redis:6379/0
      MAILPIT_URL: http://mailpit:8025
      MAILPIT_SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: .
    command: celery -A craftsman.workers.celery_app worker -Q research,generate,send,inbox,enrich,settle -l info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://craftsman:${POSTGRES_PASSWORD:-craftsman}@postgres:5432/craftsman
      REDIS_URL: redis://redis:6379/0
      MAILPIT_URL: http://mailpit:8025
      MAILPIT_SMTP_HOST: mailpit
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A craftsman.workers.celery_app beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://craftsman:${POSTGRES_PASSWORD:-craftsman}@postgres:5432/craftsman
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      # Dashboard auth — the API key stays server-side (never shipped to the browser).
      # Optional here (empty default) so `docker compose up postgres` isn't blocked by
      # global interpolation; the web app itself refuses to start if any is unset/blank
      # (see web/src/lib/session.ts and password.ts). Set them in .env — see .env.example.
      CRAFTSMAN_API_KEY: ${CRAFTSMAN_API_KEY:-}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
