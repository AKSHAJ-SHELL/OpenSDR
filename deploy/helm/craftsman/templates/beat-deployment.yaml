apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "craftsman.fullname" . }}-beat
  labels:
    {{- include "craftsman.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  # Never scale beat: one scheduler, or every periodic task fires N times.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "craftsman.labels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      containers:
        - name: beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "craftsman.workers.celery_app", "beat", "-l", "info"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.beat.resources | nindent 12 }}
