# Continuous integration for Craftsman.
#
# What this does, in plain terms:
#   1. Starts a Postgres database (with the pgvector extension) for the tests to use.
#   2. Installs the Python project and its dev dependencies.
#   3. Runs the whole pytest suite. That suite includes the migration round-trip
#      test, which upgrades a fresh database to the latest schema and back down —
#      so this job is also the "migrations run cleanly on a fresh Postgres" check.
#
# It runs on every push to main and on every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Postgres + pgvector)
    runs-on: ubuntu-latest

    # A throwaway Postgres for this job. Same image the app uses in docker-compose,
    # so pgvector is available. The tests create/drop their own databases inside it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: craftsman
          POSTGRES_PASSWORD: craftsman
          POSTGRES_DB: craftsman_test
        ports:
          - 5432:5432
        # Wait until Postgres is actually ready before the steps start.
        options: >-
          --health-cmd "pg_isready -U craftsman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Point the test suite at the Postgres service above.
      TEST_DATABASE_URL: postgresql+psycopg://craftsman:craftsman@localhost:5432/craftsman_test
      # A throwaway Fernet key used only inside this CI job, so config that expects
      # one doesn't fail at import time. It protects nothing and is not used anywhere else.
      CRAFTSMAN_SECRET_KEY: tIs53X_Pm1LFLpIuXdX8Ve1iabp4kTPD6-2JtiODuQ8=
      # Keep the LLM offline in CI — the unit layer uses the mock provider.
      LLM_PROVIDER: mock

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -v
